[package]
name = "renskriv-core"
version = "0.1.0"
edition = "2021"
description = "Norwegian PII detection and redaction engine"
license = "MIT"

[lib]
name = "renskriv_core"
crate-type = ["lib"]  # later: "cdylib" for PyO3, add wasm target

[dependencies]
regex = "1"
lazy_static = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
pretty_assertions = "1"

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="container">
            <header>
                <h1>Renskriv</h1>
                <div class="header-right">
                    <span class="status" id="status">Loading...</span>
                    <button
                        id="expand-btn"
                        class="expand-btn"
                        title="Open in a new tab"
                    >
                        &#x26F6;
                    </button>
                </div>
            </header>

            <div class="input-section">
                <label for="input-text">Paste text to scan:</label>
                <textarea
                    id="input-text"
                    rows="8"
                    placeholder="Paste text here..."
                ></textarea>
                <button id="scan-btn" disabled>Scan</button>
            </div>

            <div id="results" class="results hidden">
                <h2>Matches</h2>
                <div id="highlighted-text" class="highlighted-text"></div>
                <div id="span-list" class="span-list"></div>
                <div class="actions">
                    <button id="select-all-btn">Select all</button>
                    <button id="clear-all-btn">Clear all</button>
                </div>
                <button id="redact-btn" class="redact-btn">Redact</button>
            </div>

            <div id="output" class="output hidden">
                <h2>Redacted text</h2>
                <pre id="redacted-text"></pre>
                <button id="copy-btn">Copy</button>
            </div>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
